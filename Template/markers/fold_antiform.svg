<?xml version="1.0" encoding="UTF-8"?>
<!-- Antiform / Anticline: opposed arrows diverging from the axial trace.
     Line = y 1300. Continuous stem through the trace, sharp filled heads. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="2600" viewBox="0 0 500 2600">
  <line x1="250" y1="700" x2="250" y2="1900" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="250,20 60,760 440,760" fill="param(fill) #131313"/>
  <polygon points="250,2580 440,1840 60,1840" fill="param(fill) #131313"/>
</svg>
