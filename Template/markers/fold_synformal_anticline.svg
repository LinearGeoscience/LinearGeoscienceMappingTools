  <line x1="250" y1="20" x2="250" y2="140" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="250,640 10,60 490,60" fill="param(fill) #131313"/>
  <polygon points="250,820 10,1260 490,1260" fill="param(fill) #131313"/>
  <line x1="250" y1="2460" x2="250" y2="2580" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="250,1960 490,2540 10,2540" fill="param(fill) #131313"/>
  <polygon points="250,1780 490,1340 10,1340" fill="param(fill) #131313"/>
</svg>
