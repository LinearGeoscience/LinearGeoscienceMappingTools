  <line x1="250" y1="20" x2="250" y2="140" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="250,640 60,60 440,60" fill="param(fill) #131313"/>
  <polygon points="250,820 60,1260 440,1260" fill="param(fill) #131313"/>
  <line x1="250" y1="2460" x2="250" y2="2580" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="250,1960 440,2540 60,2540" fill="param(fill) #131313"/>
  <polygon points="250,1780 440,1340 60,1340" fill="param(fill) #131313"/>
</svg>
