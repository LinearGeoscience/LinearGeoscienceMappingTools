<?xml version="1.0" encoding="UTF-8"?>
<!-- Antiformal Syncline (refolded): outer arrows diverge (antiform now),
     inner arrows converge (synclinal younging). Line = y 1300. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="2600" viewBox="0 0 500 2600">
  <line x1="250" y1="560" x2="250" y2="2040" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="250,20 10,600 490,600" fill="param(fill) #131313"/>
  <polygon points="250,1240 10,700 490,700" fill="param(fill) #131313"/>
  <polygon points="250,2580 490,2000 10,2000" fill="param(fill) #131313"/>
  <polygon points="250,1360 490,1900 10,1900" fill="param(fill) #131313"/>
</svg>
