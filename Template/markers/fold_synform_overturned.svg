  <line x1="48" y1="320" x2="48" y2="368" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="452,200 414,320 490,320" fill="param(fill) #131313"/>
  <line x1="452" y1="320" x2="452" y2="368" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
