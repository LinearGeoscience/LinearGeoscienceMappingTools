<?xml version="1.0" encoding="UTF-8"?>
<!-- Sinistral slip couple: half-arrows with sharp filled heads, straddling
     the line (y 170). Far side moves left. Dextral is the machine mirror
     (x -> 500 - x), generated by the injector - lines and polygons only. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340">
  <line x1="150" y1="60" x2="490" y2="60" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="10,60 165,18 165,102" fill="param(fill) #131313"/>
  <line x1="10" y1="280" x2="350" y2="280" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="490,280 335,238 335,322" fill="param(fill) #131313"/>
</svg>
