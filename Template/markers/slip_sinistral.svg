<?xml version="1.0" encoding="UTF-8"?>
<!-- Sinistral slip couple: half-arrows straddling the line (y 170). Each
     head is HALF an arrowhead - a filled triangle whose sharp tip ends
     the shaft flush with its underside, hypotenuse sweeping back at ~45
     degrees away from the line. (The shaft is 25 canvas units thick at
     the authored 0.6 mm stroke, and size and stroke ride the same Weight
     ramp, so the flush fit holds at every tier.) Far side moves left.
     Dextral is the machine mirror (x -> 500 - x), generated by the
     injector - lines and polygons only. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340">
  <line x1="490" y1="95" x2="40" y2="95" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="10,107 115,0 75,107" fill="param(fill) #131313"/>
  <line x1="10" y1="245" x2="460" y2="245" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15"/>
  <polygon points="490,233 385,340 425,233" fill="param(fill) #131313"/>
</svg>
