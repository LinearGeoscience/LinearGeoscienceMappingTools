<?xml version="1.0" encoding="UTF-8"?>
<!-- Sinistral slip couple: half-arrows straddling the line (y 170) - a
     shaft with one 45-degree barb at the tip, away from the line. Each
     barb is a filled wedge tapering to a SHARP point (a stroked line can
     only end blunt); its base hides inside the shaft stroke. Far side
     moves left. Dextral is the machine mirror (x -> 500 - x), generated
     by the injector - lines and polygons only. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340">
  <line x1="10" y1="95" x2="490" y2="95" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15" stroke-linecap="round"/>
  <polygon points="28,105 8,85 113,0" fill="param(fill) #131313"/>
  <line x1="10" y1="245" x2="490" y2="245" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15" stroke-linecap="round"/>
  <polygon points="472,235 492,255 387,340" fill="param(fill) #131313"/>
</svg>
