<?xml version="1.0" encoding="UTF-8"?>
<!-- Sinistral slip couple: half-arrows (shaft + one 45-degree barb at the
     tip, on the side away from the line) straddling the line (y 170).
     Far side moves left. Dextral is the machine mirror (x -> 500 - x),
     generated by the injector - lines and polygons only. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340">
  <line x1="10" y1="95" x2="490" y2="95" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15" stroke-linecap="round"/>
  <line x1="10" y1="95" x2="105" y2="0" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15" stroke-linecap="round"/>
  <line x1="10" y1="245" x2="490" y2="245" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15" stroke-linecap="round"/>
  <line x1="490" y1="245" x2="395" y2="340" fill="none" stroke="param(outline) #131313" stroke-width="param(outline-width) 15" stroke-linecap="round"/>
</svg>
