<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: claystone
     source: Lit_Claystone.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 16 16" width="16pt" height="16pt">
  <rect width="16" height="16" fill="none" stroke="none"/>
  <!-- Dense very short horizontal dashes (finer than mudstone) -->
  <line x1="0" y1="2" x2="2" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="4" y1="2" x2="6" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="8" y1="2" x2="10" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="12" y1="2" x2="14" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="2" y1="6" x2="4" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="6" y1="6" x2="8" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="10" y1="6" x2="12" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="14" y1="6" x2="16" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="2" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="4" y1="10" x2="6" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="8" y1="10" x2="10" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="12" y1="10" x2="14" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="2" y1="14" x2="4" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="6" y1="14" x2="8" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="10" y1="14" x2="12" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="14" y1="14" x2="16" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
