<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: mudstone
     source: Lit_Mudstone.svg
     5 motif rows re-spaced on y so the rhythm divides the tile -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Row 1 -->
  <line x1="1" y1="2.4" x2="5" y2="2.4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="2.4" x2="12" y2="2.4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="2.4" x2="19" y2="2.4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="4" y1="7.2" x2="8" y2="7.2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="11" y1="7.2" x2="15" y2="7.2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="18" y1="7.2" x2="22" y2="7.2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="1" y1="12" x2="5" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="12" x2="12" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="12" x2="19" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="4" y1="16.8" x2="8" y2="16.8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="11" y1="16.8" x2="15" y2="16.8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="18" y1="16.8" x2="22" y2="16.8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="1" y1="21.6" x2="5" y2="21.6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="21.6" x2="12" y2="21.6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="21.6" x2="19" y2="21.6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
