<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: chalk
     source: Lit_Chalk.svg
     13 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath) -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 20" width="30pt" height="20pt">
  <rect width="30" height="20" fill="none" stroke="none"/>
  <!-- Brick pattern -->
  <line x1="0" y1="0" x2="30" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="30" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="20" x2="30" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="15" y1="0" x2="15" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="0" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="30" y1="10" x2="30" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Fine stipple dots in top-left brick -->
  <line x1="3" y1="3" x2="3.001" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="5" x2="8.001" y2="5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="12" y1="7" x2="12.001" y2="7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="6" y1="8" x2="6.001" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <!-- Top-right brick -->
  <line x1="19" y1="4" x2="19.001" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="24" y1="2" x2="24.001" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="27" y1="7" x2="27.001" y2="7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="21" y1="8" x2="21.001" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <!-- Bottom row brick -->
  <line x1="5" y1="14" x2="5.001" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="10" y1="12" x2="10.001" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="14" y1="17" x2="14.001" y2="17" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="20" y1="15" x2="20.001" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="26" y1="13" x2="26.001" y2="13" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
