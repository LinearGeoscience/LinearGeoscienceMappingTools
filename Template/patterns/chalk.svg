<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: chalk
     source: Lit_Chalk.svg
     13 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath)
     motif shifted by (-17,-18.5) to clear the tile edges
     1 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 20" width="30pt" height="20pt">
  <rect width="30" height="20" fill="none" stroke="none"/>
  <!-- Brick pattern -->
  <line x1="-17" y1="1.5" x2="13" y2="1.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="13" y1="1.5" x2="43" y2="1.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="-17" y1="11.5" x2="13" y2="11.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="13" y1="11.5" x2="43" y2="11.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="28" y1="1.5" x2="28" y2="11.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="13" y1="-8.5" x2="13" y2="1.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="13" y1="11.5" x2="13" y2="21.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="16" y1="4.5" x2="16.001" y2="4.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="21" y1="6.5" x2="21.001" y2="6.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="25" y1="8.5" x2="25.001" y2="8.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="19" y1="9.5" x2="19.001" y2="9.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="2" y1="5.5" x2="2.001" y2="5.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="7" y1="3.5" x2="7.001" y2="3.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="10" y1="8.5" x2="10.001" y2="8.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="4" y1="9.5" x2="4.001" y2="9.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="18" y1="15.5" x2="18.001" y2="15.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="23" y1="13.5" x2="23.001" y2="13.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="27" y1="18.5" x2="27.001" y2="18.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="16.5" x2="3.001" y2="16.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="9" y1="14.5" x2="9.001" y2="14.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
