<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: laterite
     source: Lit_Laterite.svg
     3 motif rows re-spaced on y so the rhythm divides the tile -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 20 20" width="20pt" height="20pt">
  <rect width="20" height="20" fill="none" stroke="none"/>
  <!-- Pisolitic/nodular texture (small circles in grid) -->
  <circle cx="5" cy="3.3333" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="15" cy="3.3333" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="10" cy="10" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="5" cy="16.6667" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="15" cy="16.6667" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="0" cy="10" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="20" cy="10" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
