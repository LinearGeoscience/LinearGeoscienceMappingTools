<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: migmatite
     source: Lit_Migmatite.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 24" width="30pt" height="24pt">
  <rect width="30" height="24" fill="none" stroke="none"/>
  <!-- Wavy lines -->
  <path d="M0,4 Q7.5,1 15,4 Q22.5,7 30,4" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <path d="M0,14 Q7.5,11 15,14 Q22.5,17 30,14" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <path d="M0,22 Q7.5,19 15,22 Q22.5,25 30,22" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Scattered + symbols -->
  <line x1="6" y1="8" x2="6" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="4" y1="10" x2="8" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="22" y1="8" x2="22" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="10" x2="24" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="14" y1="17" x2="14" y2="21" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="12" y1="19" x2="16" y2="19" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
