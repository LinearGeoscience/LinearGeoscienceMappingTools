<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: rhyolite
     source: Lit_Rhyolite.svg
     1 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Small triangles scattered -->
  <polygon points="5,2 7,6 3,6" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="17,3 19,7 15,7" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="11,11 13,15 9,15" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="22,12 24,16 20,16" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="-2,12 0,16 -4,16" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="4,18 6,22 2,22" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="17,19 19,23 15,23" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
