<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: crosshatch
     source: Lit_CrossHatch.svg
     28 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 20 20" width="20pt" height="20pt">
  <rect width="20" height="20" fill="none" stroke="none"/>
  <!-- 45° diagonal cross-hatching -->
  <!-- Forward diagonals (\) -->
  <line x1="0" y1="0" x2="20" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="20" x2="20" y2="40" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="-20" x2="20" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="0" x2="40" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="20" x2="40" y2="40" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="-20" x2="40" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="-20" y1="0" x2="0" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="-20" y1="20" x2="0" y2="40" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="-20" y1="-20" x2="0" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="10" y1="0" x2="20" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="10" y1="20" x2="20" y2="30" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="-10" y1="0" x2="0" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="-10" y1="20" x2="0" y2="30" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="10" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="-10" x2="10" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="10" x2="30" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="-10" x2="30" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="0" x2="0" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="20" x2="0" y2="40" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="-20" x2="0" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="40" y1="0" x2="20" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="40" y1="20" x2="20" y2="40" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="40" y1="-20" x2="20" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="0" x2="-20" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="20" x2="-20" y2="40" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="-20" x2="-20" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="10" y1="0" x2="0" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="10" y1="20" x2="0" y2="30" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="30" y1="0" x2="20" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="30" y1="20" x2="20" y2="30" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="10" x2="10" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="-10" x2="10" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="-10" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="-10" x2="-10" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
