<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: eclogite
     source: Lit_Eclogite.svg
     5 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath) -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Scattered circles (garnet) -->
  <circle cx="6" cy="6" r="3" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="18" cy="18" r="3" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Dots (omphacite) -->
  <line x1="18" y1="4" x2="18.001" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="12" y1="10" x2="12.001" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="4.001" y2="16" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="20" y1="10" x2="20.001" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="10" y1="20" x2="10.001" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
