<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: quartzite
     source: Lit_Quartzite.svg
     9 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath) -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Stipple dots -->
  <line x1="3" y1="3" x2="3.001" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="13" y1="2" x2="13.001" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="21" y1="5" x2="21.001" y2="5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="8" x2="8.001" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="18" y1="11" x2="18.001" y2="11" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="14" x2="3.001" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="13" y1="16" x2="13.001" y2="16" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="21" y1="19" x2="21.001" y2="19" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="22" x2="8.001" y2="22" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="6" y1="5" x2="10" y2="5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="16" y1="8" x2="20" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="1" y1="11" x2="5" y2="11" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="10" y1="19" x2="14" y2="19" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="17" y1="22" x2="21" y2="22" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
