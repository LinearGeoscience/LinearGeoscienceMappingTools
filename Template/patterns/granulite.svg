<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: granulite
     source: Lit_Granulite.svg
     motif shifted by (0,-4) to clear the tile edges
     2 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Fine parallel lines (spacing 8, tiles perfectly: 24/8=3) -->
  <line x1="0" y1="20" x2="24" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="4" x2="24" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="12" x2="24" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="5,-2 7,2 3,2 5,-2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="5,22 7,26 3,26 5,22" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="17,-2 19,2 15,2 17,-2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="17,22 19,26 15,26 17,22" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="11,6 13,10 9,10 11,6" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="5,14 7,18 3,18 5,14" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="17,14 19,18 15,18 17,14" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
