<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: granulite
     source: Lit_Granulite.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Fine parallel lines (spacing 8, tiles perfectly: 24/8=3) -->
  <line x1="0" y1="0" x2="24" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="8" x2="24" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="16" x2="24" y2="16" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Small triangles in each band -->
  <!-- Band 1 (y=0-8): two triangles -->
  <polyline points="5,2 7,6 3,6 5,2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="17,2 19,6 15,6 17,2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Band 2 (y=8-16): one triangle (offset) -->
  <polyline points="11,10 13,14 9,14 11,10" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Band 3 (y=16-24): two triangles -->
  <polyline points="5,18 7,22 3,22 5,18" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="17,18 19,22 15,22 17,18" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
