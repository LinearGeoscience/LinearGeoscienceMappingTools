<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: basalt
     source: Lit_Basalt.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- V-shapes row 1 -->
  <polyline points="2,3 5,7 8,3" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="14,3 17,7 20,3" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- V-shapes row 2 offset -->
  <polyline points="8,13 11,17 14,13" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- V-shapes wrapping edges -->
  <polyline points="20,13 23,17 26,13" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="-4,13 -1,17 2,13" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
