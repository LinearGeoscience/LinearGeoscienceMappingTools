<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: dolomite
     source: Lit_Dolomite.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 20" width="30pt" height="20pt">
  <rect width="30" height="20" fill="none" stroke="none"/>
  <!-- Brick pattern -->
  <line x1="0" y1="0" x2="30" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="30" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="20" x2="30" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="15" y1="0" x2="15" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="0" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="30" y1="10" x2="30" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Diagonal hatching in each brick -->
  <line x1="2" y1="2" x2="6" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="6" y1="2" x2="10" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="10" y1="2" x2="14" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="17" y1="2" x2="21" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="21" y1="2" x2="25" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="25" y1="2" x2="29" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Bottom row hatching (offset) -->
  <line x1="2" y1="12" x2="6" y2="18" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="6" y1="12" x2="10" y2="18" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="10" y1="12" x2="14" y2="18" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="17" y1="12" x2="21" y2="18" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="21" y1="12" x2="25" y2="18" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="25" y1="12" x2="29" y2="18" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
