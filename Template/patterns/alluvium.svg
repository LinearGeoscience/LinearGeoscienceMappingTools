<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: alluvium
     source: Lit_Alluvium.svg
     7 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath) -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Mixed grain sizes: small rounded pebbles + sand dots -->
  <!-- Small rounded pebbles -->
  <circle cx="5" cy="5" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="18" cy="10" r="1.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="10" cy="19" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Sand-size dots -->
  <line x1="12" y1="3" x2="12.001" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="0" y1="12" x2="0.001" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="22" y1="4" x2="22.001" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="11" x2="8.001" y2="11" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="16" x2="15.001" y2="16" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="22" x2="3.001" y2="22" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="20" y1="21" x2="20.001" y2="21" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
