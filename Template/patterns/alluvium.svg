<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: alluvium
     source: Lit_Alluvium.svg
     7 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath)
     motif shifted by (-5.5,-7.5) to clear the tile edges
     1 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Mixed grain sizes: small rounded pebbles + sand dots -->
  <!-- Small rounded pebbles -->
  <circle cx="-0.5" cy="21.5" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="23.5" cy="21.5" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="12.5" cy="2.5" r="1.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="4.5" cy="11.5" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="6.5" y1="19.5" x2="6.501" y2="19.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="18.5" y1="4.5" x2="18.501" y2="4.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="16.5" y1="20.5" x2="16.501" y2="20.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="2.5" y1="3.5" x2="2.501" y2="3.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="9.5" y1="8.5" x2="9.501" y2="8.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="21.5" y1="14.5" x2="21.501" y2="14.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="14.5" y1="13.5" x2="14.501" y2="13.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
