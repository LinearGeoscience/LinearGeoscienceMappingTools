<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: arkose
     source: Lit_Arkose.svg
     8 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath)
     motif shifted by (-6,-5.5) to clear the tile edges
     3 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Sand dots (like sandstone) -->
  <line x1="21" y1="21.5" x2="21.001" y2="21.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="9" y1="20.5" x2="9.001" y2="20.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="2.5" x2="3.001" y2="2.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="3.5" x2="15.001" y2="3.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="21" y1="9.5" x2="21.001" y2="9.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="9" y1="8.5" x2="9.001" y2="8.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="14.5" x2="3.001" y2="14.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="15.5" x2="15.001" y2="15.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <polygon points="0,-0.5 2,-1.5 3,0.5 1,1.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="0,23.5 2,22.5 3,24.5 1,25.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="24,-0.5 26,-1.5 27,0.5 25,1.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="24,23.5 26,22.5 27,24.5 25,25.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="12,5.5 14,4.5 15,6.5 13,7.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="18,11.5 20,10.5 21,12.5 19,13.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="6,17.5 8,16.5 9,18.5 7,18.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
