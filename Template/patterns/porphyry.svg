<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: porphyry
     source: Lit_Porphyry.svg
     9 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath)
     motif shifted by (-4,-0.5) to clear the tile edges
     1 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Phenocryst rectangles in fine-grained groundmass -->
  <!-- Large phenocrysts -->
  <polygon points="0,2.5 4,2.5 4,6.5 0,6.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="24,2.5 28,2.5 28,6.5 24,6.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="12,13.5 16,13.5 16,17.5 12,17.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="10" y1="2.5" x2="10.001" y2="2.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="16" y1="5.5" x2="16.001" y2="5.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="22" y1="11.5" x2="22.001" y2="11.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="6" y1="9.5" x2="6.001" y2="9.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="18" y1="10.5" x2="18.001" y2="10.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="2" y1="15.5" x2="2.001" y2="15.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="19.5" x2="8.001" y2="19.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="20" y1="21.5" x2="20.001" y2="21.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="14" y1="21.5" x2="14.001" y2="21.5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
