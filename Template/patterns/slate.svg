<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: slate
     source: Lit_Slate.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 20 20" width="20pt" height="20pt">
  <rect width="20" height="20" fill="none" stroke="none"/>
  <!-- Very fine parallel lines, tight spacing -->
  <line x1="0" y1="2" x2="20" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="4" x2="20" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="6" x2="20" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="8" x2="20" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="20" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="12" x2="20" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="14" x2="20" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="16" x2="20" y2="16" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="18" x2="20" y2="18" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="20" x2="20" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
