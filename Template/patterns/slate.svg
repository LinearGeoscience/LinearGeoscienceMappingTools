<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: slate
     source: Lit_Slate.svg
     motif shifted by (0,-1) to clear the tile edges -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 20 20" width="20pt" height="20pt">
  <rect width="20" height="20" fill="none" stroke="none"/>
  <!-- Very fine parallel lines, tight spacing -->
  <line x1="0" y1="1" x2="20" y2="1" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="3" x2="20" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="5" x2="20" y2="5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="7" x2="20" y2="7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="9" x2="20" y2="9" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="11" x2="20" y2="11" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="13" x2="20" y2="13" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="15" x2="20" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="17" x2="20" y2="17" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="19" x2="20" y2="19" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
