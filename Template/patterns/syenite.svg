<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: syenite
     source: Lit_Syenite.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Rows of short horizontal dashes (staggered) -->
  <!-- Row 1 -->
  <line x1="0" y1="3" x2="4" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="8" y1="3" x2="12" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="16" y1="3" x2="20" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Row 2 (offset by 4) -->
  <line x1="4" y1="9" x2="8" y2="9" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="12" y1="9" x2="16" y2="9" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="9" x2="24" y2="9" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Row 3 -->
  <line x1="0" y1="15" x2="4" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="8" y1="15" x2="12" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="16" y1="15" x2="20" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Row 4 (offset by 4) -->
  <line x1="4" y1="21" x2="8" y2="21" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="12" y1="21" x2="16" y2="21" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="20" y1="21" x2="24" y2="21" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
