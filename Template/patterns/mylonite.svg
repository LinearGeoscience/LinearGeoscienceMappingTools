<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: mylonite
     source: Lit_Mylonite.svg
     no repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 20" width="24pt" height="20pt">
  <rect width="24" height="20" fill="none" stroke="none"/>
  <!-- Fine parallel lines -->
  <line x1="0" y1="3" x2="24" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="7" x2="24" y2="7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="11" x2="24" y2="11" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="15" x2="24" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="19" x2="24" y2="19" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="6" y1="2" x2="8" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="18" y1="6" x2="20" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="12" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="14" x2="5" y2="16" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="16" y1="14" x2="18" y2="16" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
