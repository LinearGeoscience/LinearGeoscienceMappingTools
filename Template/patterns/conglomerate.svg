<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: conglomerate
     source: Lit_Conglomerate.svg
     6 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath) -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 30" width="30pt" height="30pt">
  <rect width="30" height="30" fill="none" stroke="none"/>
  <!-- Scattered circles/ovals representing rounded clasts -->
  <circle cx="6" cy="5" r="3" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="20" cy="4" r="2.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="13" cy="12" r="3.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="27" cy="14" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="3" cy="18" r="2.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="22" cy="24" r="3" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="8" cy="26" r="2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Stipple dots in matrix -->
  <line x1="10" y1="2" x2="10.001" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="26" y1="8" x2="26.001" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="4" y1="11" x2="4.001" y2="11" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="19" y1="18" x2="19.001" y2="18" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="25" x2="15.001" y2="25" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="28" y1="28" x2="28.001" y2="28" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
