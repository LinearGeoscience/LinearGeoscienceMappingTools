<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: shale
     source: Lit_Shale.svg
     motif shifted by (0,-8.3) to clear the tile edges -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 20 20" width="20pt" height="20pt">
  <rect width="20" height="20" fill="none" stroke="none"/>
  <line x1="0" y1="15" x2="20" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="18.3" x2="20" y2="18.3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="1.7" x2="20" y2="1.7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="5" x2="20" y2="5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="8.3" x2="20" y2="8.3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="11.7" x2="20" y2="11.7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
