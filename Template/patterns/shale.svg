<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: shale
     source: Lit_Shale.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 20 20" width="20pt" height="20pt">
  <rect width="20" height="20" fill="none" stroke="none"/>
  <line x1="0" y1="3.3" x2="20" y2="3.3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="6.6" x2="20" y2="6.6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="20" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="13.3" x2="20" y2="13.3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="16.6" x2="20" y2="16.6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="20" x2="20" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
