  <path d="M0,12 Q7.5,10 15,12 Q22.5,14 30,12" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <path d="M0,20 Q7.5,18 15,20 Q22.5,22 30,20" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
