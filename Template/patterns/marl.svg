<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: marl
     source: Lit_Marl.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 20" width="30pt" height="20pt">
  <rect width="30" height="20" fill="none" stroke="none"/>
  <!-- Brick lines (limestone component) -->
  <line x1="0" y1="0" x2="30" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="30" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="20" x2="30" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="15" y1="0" x2="15" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="10" x2="0" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="30" y1="10" x2="30" y2="20" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Horizontal dashes (mudstone component) in top-left brick -->
  <line x1="2" y1="4" x2="6" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="9" y1="4" x2="13" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="7" x2="7" y2="7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="10" y1="7" x2="14" y2="7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <!-- Top-right brick -->
  <line x1="17" y1="4" x2="21" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="24" y1="4" x2="28" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="18" y1="7" x2="22" y2="7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="25" y1="7" x2="29" y2="7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <!-- Bottom row -->
  <line x1="4" y1="14" x2="8" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="12" y1="14" x2="16" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="20" y1="14" x2="24" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="5" y1="17" x2="9" y2="17" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="13" y1="17" x2="17" y2="17" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="21" y1="17" x2="25" y2="17" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
