<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: marl
     source: Lit_Marl.svg
     motif shifted by (-7.5,-2) to clear the tile edges
     3 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
