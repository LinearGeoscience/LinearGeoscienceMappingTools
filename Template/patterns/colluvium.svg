<!-- LGS lithology texture: colluvium
     source: Lit_Colluvium.svg
     4 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath)
     motif shifted by (-7,-18) to clear the tile edges
     4 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- Angular fragments of varying sizes, loosely arranged -->
  <polygon points="-5,7 -1,6 0,9 -4,10" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="19,7 23,6 24,9 20,10" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="7,8 11,7 10,11 6,10" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="1,13 5,12 6,16 2,17" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="13,14 16,13 16,17 12,16" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="18,19 21,18 22,21 19,22" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="8,20 12,19 11,23 7,22" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="0,1 4,0 5,4 1,4" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="0,25 4,24 5,28 1,28" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="24,1 28,0 29,4 25,4" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="24,25 28,24 29,28 25,28" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="13,2 16,1 16,5 12,4" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="3" y1="8" x2="3.001" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="10" x2="15.001" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="21" y1="15" x2="21.001" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="9" y1="16" x2="9.001" y2="16" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
