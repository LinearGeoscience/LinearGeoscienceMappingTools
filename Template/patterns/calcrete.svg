<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: calcrete
     source: authored (Template/patterns_authored/)
     no repair needed -->
<!-- Authored for LGS, not from the OneDrive library.

     RCC Calcrete used the `limestone` brick, which drew a regolith carbonate
     as a bedded marine limestone - and with the limestone chemical hue on top
     of it, Calcrete and Limestone rendered as identical pixels.

     A calcrete is nodular, not bedded: carbonate precipitated as glaebules and
     void fills, giving irregular blebs of mixed size with no layering at all.

     Two things the first draft got wrong, both visible only once rendered as a
     filled area rather than as a single tile: nodules 4 units across in a 24
     unit box read as small rings rather than blebs, and six identical hexagons
     on an even lattice read as manufactured. So: five nodules spanning 5 to 8
     units, each a different irregular outline, on a deliberately uneven
     arrangement, with three small blebs filling the gaps.

     Row centres are 8 apart in a 24 box so the rhythm divides the period; every
     shape clears the tile edge, so the tile needs no wrap counterparts. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 24" width="24pt" height="24pt">
  <rect width="24" height="24" fill="none" stroke="none"/>
  <!-- large glaebule, upper left -->
  <polygon points="2.2,3.4 4.1,1.3 6.9,1.1 8.6,2.8 8.2,5.4 6.3,7 3.6,6.6 2,5.3" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="14.6,2.6 17.2,1.6 19.9,2.2 20.8,3.9 19.4,5.5 16.6,5.9 14.2,4.6" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="8.2,10.4 11.4,9.6 13.9,10.8 14.3,12.9 12.2,14.4 9.1,14.2 7.4,12.6" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="19.2,10.2 21.6,10.6 22.6,12.4 21.7,14.2 19.6,14.3 18.4,12.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="2.6,18.6 5.4,17.4 8.1,18.2 8.8,20.4 7.2,22.3 4.3,22.4 2.2,21" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="15.1,18.2 17.9,17.8 19.8,19.2 19.4,21.4 17,22.2 14.8,20.9" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="11.6,4.2 13,3.6 13.6,5 12.4,5.9 11.2,5.3" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="3.9,11.8 5.2,11.2 5.9,12.6 4.6,13.4 3.4,12.8" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polygon points="11.7,19.6 12.9,19.1 13.5,20.4 12.3,21.2 11.2,20.6" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
