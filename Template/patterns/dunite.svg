<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: dunite
     source: Lit_Dunite.svg
     16 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath) -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 16 16" width="16pt" height="16pt">
  <rect width="16" height="16" fill="none" stroke="none"/>
  <!-- Dense small filled dots (staggered grid, spacing 4) -->
  <!-- Row 1 (y=0) -->
  <line x1="0" y1="0" x2="0.001" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="4" y1="0" x2="4.001" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="0" x2="8.001" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="12" y1="0" x2="12.001" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <!-- Row 2 (y=4, offset by 2) -->
  <line x1="2" y1="4" x2="2.001" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="6" y1="4" x2="6.001" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="10" y1="4" x2="10.001" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="14" y1="4" x2="14.001" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <!-- Row 3 (y=8) -->
  <line x1="0" y1="8" x2="0.001" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="4" y1="8" x2="4.001" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="8" y1="8" x2="8.001" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="12" y1="8" x2="12.001" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <!-- Row 4 (y=12, offset by 2) -->
  <line x1="2" y1="12" x2="2.001" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="6" y1="12" x2="6.001" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="10" y1="12" x2="10.001" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="14" y1="12" x2="14.001" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
