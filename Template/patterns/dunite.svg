<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: dunite
     source: Lit_Dunite.svg
     16 zero-length dot(s) repaired to x2=x1+0.001 (Qt paints nothing for a zero-length subpath)
     motif shifted by (-1,-2) to clear the tile edges -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 16 16" width="16pt" height="16pt">
  <rect width="16" height="16" fill="none" stroke="none"/>
  <!-- Dense small filled dots (staggered grid, spacing 4) -->
  <!-- Row 1 (y=0) -->
  <line x1="15" y1="14" x2="15.001" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="14" x2="3.001" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="7" y1="14" x2="7.001" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="11" y1="14" x2="11.001" y2="14" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="1" y1="2" x2="1.001" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="5" y1="2" x2="5.001" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="9" y1="2" x2="9.001" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="13" y1="2" x2="13.001" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="6" x2="15.001" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="6" x2="3.001" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="7" y1="6" x2="7.001" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="11" y1="6" x2="11.001" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="1" y1="10" x2="1.001" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="5" y1="10" x2="5.001" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="9" y1="10" x2="9.001" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="13" y1="10" x2="13.001" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
