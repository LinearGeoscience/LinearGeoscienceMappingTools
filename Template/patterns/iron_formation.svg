<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: iron_formation
     source: Lit_Iron_Formation.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 24 12" width="24pt" height="12pt">
  <rect width="24" height="12" fill="none" stroke="none"/>
  <!-- Alternating paired bands (iron-rich / silica-rich) -->
  <line x1="0" y1="0" x2="24" y2="0" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="2" x2="24" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="6" x2="24" y2="6" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="8" x2="24" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="0" y1="12" x2="24" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
