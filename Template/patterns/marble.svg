<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: marble
     source: Lit_Marble.svg
     motif shifted by (-7.5,-5) to clear the tile edges
     9 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 20" width="30pt" height="20pt">
  <rect width="30" height="20" fill="none" stroke="none"/>
  <!-- Brick pattern -->
  <line x1="-7.5" y1="15" x2="22.5" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="22.5" y1="15" x2="52.5" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="-7.5" y1="5" x2="22.5" y2="5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="22.5" y1="5" x2="52.5" y2="5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="7.5" y1="-5" x2="7.5" y2="5" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="7.5" y1="15" x2="7.5" y2="25" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="22.5" y1="5" x2="22.5" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="-2.5" y1="-2" x2="2.5" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="-2.5" y1="18" x2="2.5" y2="22" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="27.5" y1="-2" x2="32.5" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="27.5" y1="18" x2="32.5" y2="22" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="2.5" y1="-2" x2="-2.5" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="2.5" y1="18" x2="-2.5" y2="22" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="32.5" y1="-2" x2="27.5" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="32.5" y1="18" x2="27.5" y2="22" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="12.5" y1="-2" x2="17.5" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="12.5" y1="18" x2="17.5" y2="22" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="17.5" y1="-2" x2="12.5" y2="2" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="17.5" y1="18" x2="12.5" y2="22" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <line x1="4.5" y1="8" x2="9.5" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
