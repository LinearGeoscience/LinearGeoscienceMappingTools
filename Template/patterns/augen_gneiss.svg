<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: augen_gneiss
     source: Lit_Augen_Gneiss.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 24" width="30pt" height="24pt">
  <rect width="30" height="24" fill="none" stroke="none"/>
  <!-- Gneissic banding (wavy lines) -->
  <path d="M0,4 Q7.5,2 15,4 Q22.5,6 30,4" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <path d="M0,12 Q7.5,10 15,12 Q22.5,14 30,12" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <path d="M0,20 Q7.5,18 15,20 Q22.5,22 30,20" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Augen (eye-shaped feldspar porphyroclasts) -->
  <ellipse cx="8" cy="8" rx="3.5" ry="1.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <ellipse cx="23" cy="8" rx="3" ry="1.2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <ellipse cx="15" cy="16" rx="3.5" ry="1.5" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
