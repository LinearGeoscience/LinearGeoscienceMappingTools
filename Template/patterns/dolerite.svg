<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: dolerite
     source: Lit_Dolerite.svg
     2 wrap counterpart(s) added so edge-crossing motifs complete across the seam -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 20 20" width="20pt" height="20pt">
  <rect width="20" height="20" fill="none" stroke="none"/>
  <!-- Dense short angled dashes -->
  <line x1="2" y1="1" x2="5" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="10" y1="2" x2="13" y2="4" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="17" y1="1" x2="20" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="-3" y1="1" x2="0" y2="3" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="5" y1="5" x2="8" y2="7" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="14" y1="6" x2="17" y2="8" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="1" y1="8" x2="4" y2="10" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="9" y1="9" x2="12" y2="11" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="17" y1="10" x2="20" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="-3" y1="10" x2="0" y2="12" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="3" y1="13" x2="6" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="12" y1="13" x2="15" y2="15" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="7" y1="17" x2="10" y2="19" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
  <line x1="15" y1="17" x2="18" y2="19" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1" stroke-linecap="round"/>
</svg>
