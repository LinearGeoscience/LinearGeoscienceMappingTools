<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: serpentinite
     source: Lit_Serpentinite.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 24" width="30pt" height="24pt">
  <rect width="30" height="24" fill="none" stroke="none"/>
  <!-- Wavy lines -->
  <path d="M0,4 Q7.5,1 15,4 Q22.5,7 30,4" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <path d="M0,12 Q7.5,9 15,12 Q22.5,15 30,12" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <path d="M0,20 Q7.5,17 15,20 Q22.5,23 30,20" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Small circles -->
  <circle cx="5" cy="8" r="1.2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="20" cy="7" r="1.0" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="12" cy="16" r="1.2" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <circle cx="26" cy="16" r="1.0" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
