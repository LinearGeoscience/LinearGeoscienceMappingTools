  <path d="M30,16 Q37.5,14 45,16 Q52.5,18 60,16" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <path d="M-30,16 Q-22.5,14 -15,16 Q-7.5,18 0,16" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="6,9 8,12 10,9" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="21,9 23,12 25,9" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
