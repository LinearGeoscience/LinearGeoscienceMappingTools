<?xml version="1.0" encoding="UTF-8"?>
<!-- LGS lithology texture: stromatolite
     source: Lit_Bentonite.svg
     no dot repair needed -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 30 24" width="30pt" height="24pt">
  <rect width="30" height="24" fill="none" stroke="none"/>
  <!-- Wavy clay lines -->
  <path d="M0,4 Q7.5,2 15,4 Q22.5,6 30,4" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <path d="M0,16 Q7.5,14 15,16 Q22.5,18 30,16" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <!-- Small V-shapes (volcanic ash origin) -->
  <polyline points="6,9 8,12 10,9" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="21,9 23,12 25,9" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
  <polyline points="13,20 15,23 17,20" fill="none" stroke="param(outline) #000000" stroke-width="param(outline-width) 0.1"/>
</svg>
